{% for c in candidates %}
<label class="opt">
  <input type="checkbox" name="pick_{{ gi }}" value="{{ c.id }}" {% if c.id in selected_ids %}checked{% endif %}>
  {% if c.image %}<img src="{{ c.image }}" alt="">{% else %}<span class="noimg"></span>{% endif %}
  <span>
    {{ c.name }}
    <span class="meta"><br>{{ c.artist }} · {{ c.year }} · {{ c.total_tracks }} tracks{% if c.score is not none %} · match {{ c.score }}{% endif %}</span>
  </span>
</label>
{% endfor %}
